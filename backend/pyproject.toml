[project]
name = "anomaly-lab"
version = "0.1.0"
description = "Local desktop workbench for visual anomaly detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pillow>=12.3.0",
    "numpy>=2.5.1",
    "onnx>=1.19",
    "onnxruntime>=1.23",
]

[project.optional-dependencies]
dl = [
    "anomalib>=2.6.0",
    # `efficientad_custom`'s own dependency, and it is deliberately *only* torch: our
    # implementation of EfficientAD does not import anomalib, which is what makes the two
    # a real comparison rather than two views of one library. Declared directly rather
    # than relied on transitively, so removing anomalib some day does not silently remove
    # the custom method too.
    "mobile-sam",
    "timm>=1.0.24",
    "torch>=2.13",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    # httpx2, not httpx: starlette's TestClient deprecates the httpx 0.x backend.
    "httpx2>=2.9",
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_lab"]

# Migrations are data files, not Python modules; they must ship with the package.
[tool.hatch.build.targets.wheel.force-include]
"src/anomaly_lab/db/migrations" = "anomaly_lab/db/migrations"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib — paths come from Settings, never from string joins
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a mutable default is evaluated once and shared. FastAPI's parameter
# markers are the documented way to declare validation and docs on a route argument, and
# they are immutable descriptors rather than shared state, so they are exempt.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately shadow builtins in fixtures and use assert-heavy style.
"tests/*" = ["A002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# anomalib ships no py.typed marker, and torch's stubs do not cover everything the
# EfficientAD wrapper touches. The wrapper is confined to one module and imports these
# lazily inside functions, so the untyped surface is small and visible rather than
# spread through the codebase.
#
# `torch` itself is listed for a different reason: it lives behind the optional `dl`
# extra, so the environment CI type-checks in does not have it installed at all. Without
# this, mypy fails on the two lazy `import torch` statements on any checkout that did not
# opt into the extra — which is every checkout that follows the documented default.
# `onnxruntime` is a normal dependency but publishes no complete typed public surface;
# deployment imports it lazily through `importlib` and narrows the returned numpy array.
[[tool.mypy.overrides]]
module = [
    "anomalib.*",
    "mobile_sam",
    "mobile_sam.*",
    "onnxruntime",
    "onnxruntime.*",
    "torch",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

# `efficientad_nets` is the one module that defines real `nn.Module` subclasses rather
# than holding torch objects as `Any`. In the environment CI type-checks in, torch is not
# installed, so `nn.Module` resolves to `Any` and `strict`'s `disallow_subclassing_any`
# rejects every class in the file. The alternative — a `type: ignore` on each class
# statement — puts five silencers in the source to work around a property of the checking
# environment rather than of the code.
[[tool.mypy.overrides]]
module = ["anomaly_lab.models.efficientad_nets"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git", rev = "f706ad9c4eb7f219c00d9050e46328518ffb65d2" }
