name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Repo safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ADR-0001's guard. CI never has access to privatedata/, so this is checking that
      # nothing from it was ever committed, not that this run is clean.
      - run: ./scripts/check-repo-safety.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --directory backend --locked

      - name: Lint
        run: uv run --directory backend ruff check .

      - name: Format
        run: uv run --directory backend ruff format --check .

      - name: Types
        run: uv run --directory backend mypy

      # Deliberately *without* `--extra dl`. This job is what measures the torch-free
      # boundary rather than asserting it: `pixel_reference`, the evaluation layer and
      # every test but the EfficientAD ones must pass with no torch installed. The
      # `dl`-gated files skip here and run in `backend-dl` below.
      - name: Tests
        run: uv run --directory backend pytest

  # The other half of that boundary. ADR-0025 records, as an accepted cost, that the
  # `dl`-gated tests were "the only check on the exactness claim" and were run nowhere but
  # the author's machine — so a checkout that never installs the extra would not notice
  # them breaking. This is that gap closed.
  #
  # Affordable only because the two expensive downloads are already avoided: the resume
  # tests monkeypatch the 1.5 GB ImageNette penalty set away, and the introspection tests
  # build anomalib's PDN directly. What is left is the install (cached) and the 40 MB
  # pretrained teacher.
  backend-dl:
    name: Backend (dl extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install with the dl extra
        run: uv sync --directory backend --locked --extra dl

      # A glob rather than a list of filenames: M6 added four more files here, and a list
      # that has to be edited for each one goes stale silently — a `dl`-gated file nobody
      # added would skip in the job above and run nowhere at all, which is the exact gap
      # this job was created to close. Everything else is already covered above.
      #
      # The glob is therefore a **naming contract**, not a convenience: a `dl`-gated test
      # file must be called `test_dl_*.py` or it runs nowhere. That is a real edge —
      # `test_teacher_distill.py` was written, matched nothing, and would have gone untested
      # in CI while passing locally, which is the failure this comment describes happening
      # to the comment.
      #
      # The rule used to be spelled `test_efficientad_*.py`, which worked exactly as long as
      # EfficientAD was the only method behind the extra. M7's `test_patchcore.py` would
      # have matched nothing — the same failure again, one method later — so the contract
      # was renamed to say what it means rather than which method happened to need it first.
      # Still one naming rule and not a second pattern to remember, which was the original
      # argument and survives the rename.
      #
      # `test_efficientad_assets.py` is deliberately **not** renamed: it has no
      # `importorskip`, it exercises checksum and archive handling in pure Python, and it
      # runs in the job above. Being torch-free is what disqualifies it, and the rename is
      # what makes that legible — under the old glob it ran in both jobs for no reason.
      #
      # It runs on CPU — the MPS path stays local-only, and no assertion here depends on
      # the device. This is by far the slowest job, because `test_dl_efficientad_custom.py`
      # and `test_dl_patchcore.py` train real models: a method that runs without detecting
      # anything is the failure worth catching, and nothing cheaper catches it. The cost is
      # dominated by *fitting*, not by the number of assertions, so the way to keep it down
      # is to share fitted models between tests that only read them — which is what the
      # `saved`, `trained` and `fitted` module fixtures are for. Adding another test that
      # fits its own model is a decision about this job's runtime, not a free addition.
      #
      # `cd backend` rather than `uv run --directory backend`, because the shell expands
      # the glob before uv changes directory: from the repository root the pattern matches
      # nothing, and pytest exits 4 having run no tests. Caught by this job failing on the
      # commit that introduced it, which is the job working.
      - name: The dl-gated tests
        run: cd backend && uv run pytest tests/test_dl_*.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # frontend/package.json depends on @vitavision/lab-ui as `file:../../lab-ui` -- a
      # sibling checkout of this repo, same as on a contributor's own machine. `path` is
      # resolved under $GITHUB_WORKSPACE, so `../lab-ui` lands one level up from this
      # repo's own checkout: exactly the sibling the relative dependency path expects.
      - uses: actions/checkout@v7
        with:
          repository: VitalyVorobyev/lab-ui
          path: ../lab-ui

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # lab-ui ships no build output in git (its dist/ is gitignored, same convention as
      # this repo's own frontend/dist) -- it has to be built before this repo's `bun
      # install` can resolve the package's exports.
      - name: Build @vitavision/lab-ui
        run: |
          bun install
          bun run build
        working-directory: ../lab-ui

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Types
        run: bun run typecheck
        working-directory: frontend

      - name: Tests
        run: bun run test
        working-directory: frontend

      - name: Build
        run: bunx vite build
        working-directory: frontend

  api-contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: uv sync --directory backend --locked

      # The committed TypeScript client must match the schema the backend actually
      # serves. Without this, a route change silently desynchronizes the frontend --
      # exactly the drift ADR-0003 flags as a runtime failure.
      - name: Regenerate and compare
        run: |
          ./scripts/gen-api-types.sh
          if ! git diff --exit-code -- frontend/src/api/generated.ts; then
            echo "::error::frontend/src/api/generated.ts is stale. Run scripts/gen-api-types.sh and commit the result."
            exit 1
          fi

  deployment:
    name: Rust deployment handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --directory backend --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deployment/runner

      - name: Format
        run: cargo fmt --manifest-path deployment/runner/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path deployment/runner/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests and release runner
        run: |
          cargo test --manifest-path deployment/runner/Cargo.toml
          cargo build --release --manifest-path deployment/runner/Cargo.toml

      - name: Python export to Rust runtime parity
        env:
          ANOMALY_LAB_RUST_RUNNER: ${{ github.workspace }}/deployment/runner/target/release/anomaly-lab-runner
        run: uv run --directory backend pytest tests/test_rust_deployment_handoff.py

  documentation:
    name: User book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --directory backend --locked

      - name: Generated pages are current
        run: uv run --directory backend python ../scripts/build-book.py --check

      - name: Documentation links are valid
        run: uv run --directory backend python ../scripts/check-doc-links.py

      # Pin the official mdBook release so a renderer update cannot silently change the
      # published navigation or break links in an unrelated application PR.
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.3

      - name: Build the book
        run: mdbook build

  shell:
    name: Tauri shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # See the Frontend job above: frontend/'s `file:../../lab-ui` dependency needs the
      # package checked out as a sibling and built before `bun install` here.
      - uses: actions/checkout@v7
        with:
          repository: VitalyVorobyev/lab-ui
          path: ../lab-ui

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build @vitavision/lab-ui
        run: |
          bun install
          bun run build
        working-directory: ../lab-ui

      # tauri-build reads tauri.conf.json, which points at the built frontend.
      - name: Build the frontend
        run: |
          bun install --frozen-lockfile
          bunx vite build
        working-directory: frontend

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: frontend/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: frontend/src-tauri
