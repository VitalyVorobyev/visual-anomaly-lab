name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Repo safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ADR-0001's guard. CI never has access to privatedata/, so this is checking that
      # nothing from it was ever committed, not that this run is clean.
      - run: ./scripts/check-repo-safety.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --directory backend --locked

      - name: Lint
        run: uv run --directory backend ruff check .

      - name: Format
        run: uv run --directory backend ruff format --check .

      - name: Types
        run: uv run --directory backend mypy

      # Deliberately *without* `--extra dl`. This job is what measures the torch-free
      # boundary rather than asserting it: `pixel_reference`, the evaluation layer and
      # every test but the EfficientAD ones must pass with no torch installed. The
      # `dl`-gated files skip here and run in `backend-dl` below.
      - name: Tests
        run: uv run --directory backend pytest

  # The other half of that boundary. ADR-0025 records, as an accepted cost, that the
  # `dl`-gated tests were "the only check on the exactness claim" and were run nowhere but
  # the author's machine — so a checkout that never installs the extra would not notice
  # them breaking. This is that gap closed.
  #
  # Affordable only because the two expensive downloads are already avoided: the resume
  # tests monkeypatch the 1.5 GB ImageNette penalty set away, and the introspection tests
  # build anomalib's PDN directly. What is left is the install (cached) and the 40 MB
  # pretrained teacher.
  backend-dl:
    name: Backend (dl extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install with the dl extra
        run: uv sync --directory backend --locked --extra dl

      # Named explicitly rather than run as the whole suite: everything else is already
      # covered above, and this job exists for the files that cannot run there. It runs on
      # CPU — the MPS path stays local-only, and no assertion here depends on the device.
      - name: The dl-gated tests
        run: uv run --directory backend pytest tests/test_efficientad_resume.py tests/test_efficientad_introspect.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Types
        run: bun run typecheck
        working-directory: frontend

      - name: Tests
        run: bun run test
        working-directory: frontend

      - name: Build
        run: bunx vite build
        working-directory: frontend

  api-contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: uv sync --directory backend --locked

      # The committed TypeScript client must match the schema the backend actually
      # serves. Without this, a route change silently desynchronizes the frontend --
      # exactly the drift ADR-0003 flags as a runtime failure.
      - name: Regenerate and compare
        run: |
          ./scripts/gen-api-types.sh
          if ! git diff --exit-code -- frontend/src/api/generated.ts; then
            echo "::error::frontend/src/api/generated.ts is stale. Run scripts/gen-api-types.sh and commit the result."
            exit 1
          fi

  shell:
    name: Tauri shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # tauri-build reads tauri.conf.json, which points at the built frontend.
      - name: Build the frontend
        run: |
          bun install --frozen-lockfile
          bunx vite build
        working-directory: frontend

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: frontend/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: frontend/src-tauri
