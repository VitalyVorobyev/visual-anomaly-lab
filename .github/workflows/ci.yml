name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Repo safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ADR-0001's guard. CI never has access to privatedata/, so this is checking that
      # nothing from it was ever committed, not that this run is clean.
      - run: ./scripts/check-repo-safety.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --directory backend --locked

      - name: Lint
        run: uv run --directory backend ruff check .

      - name: Format
        run: uv run --directory backend ruff format --check .

      - name: Types
        run: uv run --directory backend mypy

      # Deliberately *without* `--extra dl`. This job is what measures the torch-free
      # boundary rather than asserting it: `pixel_reference`, the evaluation layer and
      # every test but the EfficientAD ones must pass with no torch installed. The
      # `dl`-gated files skip here and run in `backend-dl` below.
      - name: Tests
        run: uv run --directory backend pytest

  # The other half of that boundary. ADR-0025 records, as an accepted cost, that the
  # `dl`-gated tests were "the only check on the exactness claim" and were run nowhere but
  # the author's machine — so a checkout that never installs the extra would not notice
  # them breaking. This is that gap closed.
  #
  # Affordable only because the two expensive downloads are already avoided: the resume
  # tests monkeypatch the 1.5 GB ImageNette penalty set away, and the introspection tests
  # build anomalib's PDN directly. What is left is the install (cached) and the 40 MB
  # pretrained teacher.
  backend-dl:
    name: Backend (dl extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install with the dl extra
        run: uv sync --directory backend --locked --extra dl

      # A glob rather than a list of filenames: M6 added three more files here, and a list
      # that has to be edited for each one goes stale silently — a `dl`-gated file nobody
      # added would skip in the job above and run nowhere at all, which is the exact gap
      # this job was created to close. Everything else is already covered above.
      #
      # It runs on CPU — the MPS path stays local-only, and no assertion here depends on
      # the device. This is by far the slowest job, because `test_efficientad_custom.py`
      # trains real models: a method that runs without detecting anything is the failure
      # worth catching, and nothing cheaper catches it. The cost is dominated by *fitting*,
      # not by the number of assertions, so the way to keep it down is to share fitted
      # models between tests that only read them — which is what the `saved` and `trained`
      # module fixtures are for. Adding another test that fits its own model is a decision
      # about this job's runtime, not a free addition.
      #
      # `cd backend` rather than `uv run --directory backend`, because the shell expands
      # the glob before uv changes directory: from the repository root the pattern matches
      # nothing, and pytest exits 4 having run no tests. Caught by this job failing on the
      # commit that introduced it, which is the job working.
      - name: The dl-gated tests
        run: cd backend && uv run pytest tests/test_efficientad_*.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Types
        run: bun run typecheck
        working-directory: frontend

      - name: Tests
        run: bun run test
        working-directory: frontend

      - name: Build
        run: bunx vite build
        working-directory: frontend

  api-contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: uv sync --directory backend --locked

      # The committed TypeScript client must match the schema the backend actually
      # serves. Without this, a route change silently desynchronizes the frontend --
      # exactly the drift ADR-0003 flags as a runtime failure.
      - name: Regenerate and compare
        run: |
          ./scripts/gen-api-types.sh
          if ! git diff --exit-code -- frontend/src/api/generated.ts; then
            echo "::error::frontend/src/api/generated.ts is stale. Run scripts/gen-api-types.sh and commit the result."
            exit 1
          fi

  shell:
    name: Tauri shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # tauri-build reads tauri.conf.json, which points at the built frontend.
      - name: Build the frontend
        run: |
          bun install --frozen-lockfile
          bunx vite build
        working-directory: frontend

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: frontend/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: frontend/src-tauri
