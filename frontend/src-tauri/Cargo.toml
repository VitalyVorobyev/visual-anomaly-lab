[package]
name = "visual-anomaly-lab"
version = "0.1.0"
description = "Local desktop workbench for visual anomaly detection"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.0.0-rc.8"

[features]
# Enabled by `tauri dev`/`tauri build` to opt into a custom protocol on macOS.
custom-protocol = ["tauri/custom-protocol"]
