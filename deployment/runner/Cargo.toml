[package]
name = "anomaly-lab-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Reference Rust consumer for visual-anomaly-lab deployment bundles"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ort = "=2.0.0-rc.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
